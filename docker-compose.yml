services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seek
      POSTGRES_PASSWORD: seek
      POSTGRES_DB: seektrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg-isready -U seek -d seektrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://seek:seek@postgres:5432/seektrack
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
