name = "seek-track"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist-cf"

# Build output for Cloudflare Pages
# Run: npm run build:cf
# Then: wrangler pages deploy dist-cf --project-name=seek-track

# D1 Database binding (replaces Neon Postgres)
[[d1_databases]]
binding = "DB"
database_name = "seek-track-db"
database_id = "af9e14d2-83fd-4e32-84b9-623cc5557da6"

# Environment variables (secrets) are managed via Cloudflare Dashboard or CLI:
# Remove: wrangler pages secret put DATABASE_URL (no longer needed with D1)
# wrangler pages secret put AUTH_PASSWORD --project-name=seek-track
# wrangler pages secret put AUTH_USER --project-name=seek-track (optional, defaults to "admin")
# wrangler pages secret put ALPACA_API_KEY --project-name=seek-track
# wrangler pages secret put ALPACA_SECRET_KEY --project-name=seek-track

[env.production]
# Production environment - secrets set via wrangler pages secret put

[[env.production.d1_databases]]
binding = "DB"
database_name = "seek-track-db"
database_id = "af9e14d2-83fd-4e32-84b9-623cc5557da6"

[env.preview]
# Preview environment (same D1 database for now)

[[env.preview.d1_databases]]
binding = "DB"
database_name = "seek-track-db"
database_id = "af9e14d2-83fd-4e32-84b9-623cc5557da6"
