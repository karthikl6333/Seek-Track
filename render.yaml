services:
  - type: web
    name: seek-track
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seek-track-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: PORT
        value: "10000"

databases:
  - name: seek-track-db
    plan: free
